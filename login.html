<<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terraria Banner Shop - Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #1a1a1e; color: #f0f0f0; margin: 0; padding: 20px; }
        .container { max-width: 480px; margin: 40px auto; background: #25252b; padding: 30px; border-radius: 8px; border: 2px solid #444; }
        h1, h2 { text-align: center; color: #ffca28; margin-top: 0; }
        nav { text-align: center; margin-bottom: 20px; }
        nav a { color: #81d4fa; text-decoration: none; margin: 0 8px; font-weight: bold; }
        label { display: block; margin-top: 14px; font-weight: bold; font-size: 14px; }
        input { width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box; background: #1a1a1e; color: #fff; border: 1px solid #555; border-radius: 4px; }
        button { width: 100%; padding: 12px; background: #0288d1; color: white; font-weight: bold; border: none; border-radius: 4px; margin-top: 22px; cursor: pointer; font-size: 16px; }
        button:hover { background: #0277bd; }
        .success-box { display: none; margin-top: 20px; padding: 15px; background: #1b5e20; border: 1px solid #4caf50; border-radius: 5px; text-align: center; }
        .switch-page { text-align: center; margin-top: 15px; font-size: 14px; }
        .switch-page a { color: #81d4fa; text-decoration: none; }
    </style>
</head>
<body>

    <nav>
        <a href="products.html">Catalog</a> |
        <a href="register.html">Register</a> |
        <a href="login.html">Login</a> |
        <a href="contact.html">Contact Us</a>
    </nav>

    <div class="container">
        <h1>Terraria Shop</h1>
        <h2>User Login</h2>
        
        <form id="loginForm">
            <label>Email Address</label>
            <input type="email" id="email" required>

            <label>Password</label>
            <input type="password" id="password" required>

            <button type="submit">Log In</button>
        </form>

        <div id="successBox" class="success-box">
            <h3>Welcome Back, <span id="userName"></span>!</h3>
            <p>Your retrieved voucher code: <strong id="userVoucher" style="background: #000; padding: 4px 8px; border-radius: 4px;"></strong></p>
            <button onclick="window.location.href='products.html'" style="background: #ffca28; color: #111; margin-top: 10px;">Go to Catalog</button>
        </div>

        <div class="switch-page">
            <p>Need an account? <a href="register.html">Register here</a></p>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://dbwmpkgzbdqidbjghnez.supabase.co';
        const supabaseKey = 'sb_publishable_lA0OAlDYUigOZXkgOK6baw_52fNi8Ec';
        const db = supabase.createClient(supabaseUrl, supabaseKey);

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const emailInput = document.getElementById('email').value.trim();
            const passInput = document.getElementById('password').value.trim();

            const { data, error } = await db
                .from('users')
                .select('*')
                .eq('email', emailInput)
                .eq('password', passInput);

            if (error) {
                alert("Login lookup failed: " + error.message);
            } else if (data && data.length > 0) {
                const user = data[0];
                localStorage.setItem("userVoucher", user.voucher_code);
                localStorage.setItem("userName", user.first_name);

                document.getElementById('loginForm').style.display = "none";
                document.getElementById('successBox').style.display = "block";
                document.getElementById('userName').innerText = user.first_name;
                document.getElementById('userVoucher').innerText = user.voucher_code;
            } else {
                alert("Invalid email or password combination.");
            }
        });
    </script>
</body>
</html>
