<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terraria Banner Store - Final Project</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #1a1a1e; 
            color: #f0f0f0; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
        }
        .landing-card { 
            background: #25252b; 
            border: 2px solid #ffca28; 
            border-radius: 12px; 
            padding: 40px; 
            max-width: 520px; 
            width: 90%; 
            text-align: center; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
        }
        .badge { 
            background: #0288d1; 
            color: #fff; 
            font-size: 12px; 
            font-weight: bold; 
            padding: 4px 12px; 
            border-radius: 20px; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
        }
        h1 { 
            color: #ffca28; 
            margin-top: 15px; 
            margin-bottom: 5px; 
            font-size: 28px; 
        }
        h2 { 
            color: #81d4fa; 
            font-weight: 400; 
            font-size: 18px; 
            margin-top: 0; 
            margin-bottom: 25px; 
        }
        .info-box { 
            background: #1a1a1e; 
            padding: 20px; 
            border-radius: 8px; 
            border: 1px solid #444; 
            margin-bottom: 25px; 
            text-align: left; 
        }
        .info-box p { 
            margin: 8px 0; 
            font-size: 14px; 
            color: #ccc; 
        }
        .info-box strong { 
            color: #fff; 
        }
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn-proceed { 
            display: block; 
            width: 100%; 
            padding: 14px 0; 
            background: #2e7d32; 
            color: white; 
            font-size: 16px; 
            font-weight: bold; 
            text-decoration: none; 
            border-radius: 6px; 
            transition: background 0.2s ease; 
            box-sizing: border-box; 
        }
        .btn-proceed:hover { 
            background: #388e3c; 
        }
        .btn-admin { 
            display: block; 
            width: 100%; 
            padding: 14px 0; 
            background: #0288d1; 
            color: white; 
            font-size: 16px; 
            font-weight: bold; 
            text-decoration: none; 
            border-radius: 6px; 
            transition: background 0.2s ease; 
            box-sizing: border-box; 
        }
        .btn-admin:hover { 
            background: #0277bd; 
        }
    </style>
</head>
<body>

    <div class="landing-card">
        <span class="badge">Final Project</span>
        <h1>Terraria Banner Store</h1>
        <h2>Introduction to Computing</h2>

        <div class="info-box">
            <p><strong>Submitted by:</strong> Capule, John Carlo & Turgo, Ron</p>
            <p><strong>Course & Section:</strong> BS Computer Science - CS11S1</p>
        </div>

        <div class="button-group">
            <a href="register.html" class="btn-proceed">Proceed to Store Register ➔</a>
            <a href="admin.html" class="btn-admin">View Live Database (Admin) 📊</a>
        </div>
    </div>

</body>
</html>
